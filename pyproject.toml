[project]
name = "local-drama-studio"
version = "0.1.0"
description = "Local AI drama production lab: script -> storyboard -> image/video -> voice -> subtitles -> MP4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16,<1.0",
    "rich>=13.9",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28,<1.0",
    "websockets>=14.0,<16.0",
    "pysubs2>=1.8",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
drama = "drama_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

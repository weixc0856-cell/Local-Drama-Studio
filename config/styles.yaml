    camera_language: 慢速推近、缓慢拉远、横移长卷；轻微镜头光晕，不用手持晃动
    composition: 电影级广角与纵深；天空/积云占画面重要比例；前景（电线/栏杆/草丛）—中景（街道/铁道/水面）—远景（山/云）三层分明；9:16 竖屏
    character_design: 无人物或仅远处剪影；不承诺同脸
    environment_design: 现代日本小镇、铁道、学校、便利店、河堤、海边与城市天台；建筑与电线结构清晰，云层体积感强

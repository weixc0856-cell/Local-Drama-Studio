# config/styles.yaml — 双核心东方美学风格预设（S1）
#
# 本文件是产品两种核心视觉风格的唯一配置来源。作品通过 style id 选择风格，
# 通用代码里不得出现 `if style == ...` 的分支。本文件不写任何作品名、诗词
# 句子或示例画面内容。
#
# 字段边界：
#   - 现有生成链路只消费 visual_language 与 positive_prompt
#     （src/drama_studio/script_engine.py:compose_visual_prompt）。因此这两个
#     字段必须自包含材质、线条与细节描述，保证不改代码即可进入生成。
#   - material / line / detail 是结构化审计字段，供规范核对与后续参数化；
#     它们不会单独拼接进提示词。
#   - motion / compositing 由 drama_studio.motion 消费（S2 验证 + 生产镜头渲染）；
#     camera / local_policy / transition 是机械执行策略，不是提示词。
#   - 与 workspace `styles` 实体共有的字段见 style_presets.STYLE_ENTITY_FIELDS；
#     配置层独有字段不写入 SQLite，也不自动导入工作台。
#
# 验证状态使用 PRD §0.2 词典：两种风格已有技术样片与 2026-11-04 A/B 人工选型，
# 但尚无完整作品，故为 PARTIAL。

schema_version: "1.0"

styles:
  court_green_fine_line:
    id: court_green_fine_line
    name: 宋代院体青绿工笔
    name_en: Song Court Blue-Green Fine-Line
    description: 绢本设色、结构清晰的宋代院体青绿工笔；以长卷横移与缓慢推近让静态画卷产生生命感。
    validation_status: PARTIAL

    visual_language: 宋代院体青绿工笔；绢本设色，细密绢纹与矿物颜料层；石青石绿为主，赭石泥金点缀；游丝描与铁线描勾勒，结构清晰、层次分明、留白克制；非照片写实
    color_palette:
      绢底: "#E3D6BE"
      石青: "#2E5E75"
      石绿: "#4E7A5E"
      赭石: "#8C5A3B"
      泥金: "#B8933E"
      墨线: "#1B1A17"
      绢白: "#EFE7D6"
    lighting: 均匀柔和的自然光；晨昏低角度暖光；阴影保留层次，不得发白光或整体过曝
    camera_language: 固定机位、长卷横移、缓慢推近；横移速度稳定；禁止快速摇镜与手持晃动
    composition: 院体秩序，近景—中景—远景三层分明；地平线不居中；留白克制；9:16 竖屏主体居中偏上，字幕安全区不压主体
    character_design: 人物以远景或中景出现，比例准确，衣纹线条清晰；v1 不承诺跨镜头正脸一致
    environment_design: 山石、树木、建筑、水面结构明确；同一空间内山形与建筑方位稳定，不换岸、不跳变
    positive_prompt: 宋代院体青绿工笔风格，绢本设色，细密绢纹与矿物颜料层；石青石绿为主，赭石泥金点缀；游丝描与铁线描勾勒的建筑、树木、山石与花鸟结构清晰；远近层次分明，留白克制；克制而精致，不是照片写实
    negative_prompt: 现代建筑，电线，霓虹灯，高饱和青橙调色，塑料质感，CG 发光粒子，过度磨皮，照片写实，文字，水印，字幕，低清晰度，结构崩坏，多余肢体，水墨渗染，粗糙笔触，现代 3D，强烈镜头光晕，高对比动漫天空

    reference_assets: []
    aspect_ratio: "9:16"
    applicable_content_types: [山水, 长卷, 建筑, 花鸟, 空镜]
    source_files: [docs/VISUAL_STYLE.md]

    material:
      kind: silk
      prompt: 绢本设色，细密绢纹，矿物颜料层，轻微历史沉淀感
    line:
      style: fine_line
      prompt: 游丝描与铁线描，细密、克制、清晰的轮廓
    detail:
      level: high
      prompt: 建筑、树木、山石、人物与花鸟结构明确，细节可辨

    motion:
      primary: [scroll_pan, slow_push_in]
      local: [clouds, water, birds, foliage]
      wan:
        allowed: true
        usage: local_supplement
        note: 只用于云雾、水面、飞鸟等局部动态；不承担人物动作或主体位移
      forbidden: [fast_pan, handheld_shake, subject_displacement]

      # 机械执行策略（由 drama_studio.motion 消费）。风格差异只来自这里，
      # 通用代码不得按 style id 分支。
      camera:
        default: scroll_pan
        allowed: [scroll_pan, slow_push_in, slow_pull_out, push_in_with_pan, static]
        scroll_speed_px_s: 30
        slow_track_speed_factor: 0.6
        push_rate_per_s: 0.008
        push_pan_fraction: 0.02
        push_scale_min: 1.03
        push_scale_max: 1.06
        easing: linear
        focus: [0.5, 0.5]
      local_policy:
        water_ripple:
          enabled: true
          amplitude_px: 2.4
          period_s: 11.0
          opacity: 1.0
          feather_px: 50
          wavelength_px: 340
          vertical_ratio: 0.24
          perspective_far_scale: 0.14
        reflection_distortion:
          enabled: true
          amplitude_px: 1.4
          period_s: 11.0
          opacity: 1.0
          feather_px: 40
          wavelength_px: 340
          vertical_ratio: 0.24
          perspective_far_scale: 0.14
          reflection_ratio: 0.55
          reflection_lag_s: 0.2
          smear_px: 3.0
        cloud_drift:
          enabled: true
          amplitude_px: 11.0
          period_s: 22.0
          opacity: 1.0
          feather_px: 60
        leaf_sway:
          enabled: true
          amplitude_px: 1.0
          period_s: 6.5
          opacity: 1.0
          feather_px: 30
          sway_exponent: 1.4
          top_decay: 0.2
        reed_sway:
          enabled: true
          amplitude_px: 1.5
          period_s: 7.0
          opacity: 1.0
          feather_px: 35
          sway_exponent: 1.3
          top_decay: 0.2
        ink_diffusion:
          enabled: false
          amplitude_px: 0
          period_s: 10.0
          opacity: 0.0
          feather_px: 60
      transition:
        type: crossfade
        duration_s: 0.8
        max_fraction: 0.35
        feather: 0.12
        direction: ltr
        seed: 13

    aesthetic_profile:
      composition:
        preferred_strategies: [rule_of_thirds, symmetry, frame_in_frame, vertical_depth, scattered_perspective, high_distance, deep_distance, level_distance]
        default_subject_position: center
        whitespace_range: [0.10, 0.35]
        shot_sizes: [wide, extreme_wide, medium, detail]
      lighting:
        preferred: [soft_ambient, morning_side, sunset_warm, cloud_gap]
        default_key: sun_high
        default_quality: soft
        default_direction: side_left
        default_contrast: medium
        rim_light: rare
      color:
        continuity_group: court_green
        dominant_keys: [石青, 石绿]
        secondary_keys: [绢底, 绢白]
        accent_keys: [赭石, 泥金]
        default_temperature: cool
        saturation_range: [0.08, 0.35]
        value_range: middle
      depth:
        default_layers: 3
        aerial_perspective: true
        sharpness_falloff: medium
      mise_en_scene:
        period: 宋代
        architecture_positive: 宋代木构楼阁，歇山顶、斗拱、朱栏、窗棂，结构清楚
        positive_constraints:
          - 建筑形制为宋代院体绘画中的木构楼阁
          - 器物与服饰为宋代以前形制
      storytelling:
        default_rhythm: stately
        emotion_vocabulary: [清雅, 秩序, 静谧, 宏阔]

    compositing:
      primitives: [paper_texture, scroll_pan, line_reveal, local_motion]
      texture:
        kind: silk
        asset: null
        opacity: 0.12
        note: 纹理只做低强度叠加，不得压过主体线条与细节
      parallax:
        allowed: true
        requires: 长卷横移需要宽幅静帧（高 1920 时宽 > 1080）与独立前景资产；近层安全边距 = (1/alpha - 1) × 横移量
        camera_moves: [scroll_pan, slow_lateral_track, slow_push_in]
        max_plates: 3
        depth_alpha_min: 0.50
        depth_alpha_max: 0.75
        background_margin: 0.05
      note: 线描显现必须与底图对齐，不得出现 PPT 式叠加，也不宣传为真实绘画过程模拟

  ink_wash:
    id: ink_wash
    name: 东方写意水墨
    name_en: Oriental Ink Wash Painting
    description: 生宣纸本、墨分五色、以留白与渗染构图的东方写意水墨；运动来自墨迹、雾气、水面与局部微动。
    validation_status: PARTIAL

    visual_language: 东方写意水墨；生宣纸本，墨分五色，浓淡干湿自然渗化；大面积留白，笔触概括，局部虚化；以墨黑灰为主，少量赭石与淡花青点缀；画面气韵流动，不是给普通图片加黑白滤镜
    color_palette:
      生宣: "#EDE4D3"
      焦墨: "#141414"
      浓墨: "#3D3A36"
      中墨: "#7A756D"
      淡墨: "#C2BDB2"
      赭石: "#9A6B4F"
      淡花青: "#6C7F86"
    lighting: 以墨色浓淡与留白表现光线，不依赖强对比布光；雾气与水面有空气感，避免夜景式硬光
    camera_language: 近乎静帧的缓慢横移或轻微推近；主要运动由墨迹渗染、雾气、水面与飞鸟完成
    composition: 留白即构图，虚实相生；主体不超过画面一半；9:16 竖屏上方保留气口，字幕安全区不压主体
    character_design: 人物概括、虚化或剪影；不追求面部细节，不承诺跨镜头一致
    environment_design: 山、水、云、树以墨色层次区分；空间关系依靠叠墨与留白，不依靠硬透视
    positive_prompt: 东方写意水墨风格，生宣纸本，墨分五色，浓淡干湿自然渗化；大面积留白，笔触概括，局部虚化；以墨黑灰为主，少量赭石与淡花青；画面气韵流动，不是黑白滤镜
    negative_prompt: 黑白滤镜，硬边缘阈值，矢量插画，照片写实，高饱和，现代建筑，文字，水印，字幕，CG 发光，结构崩坏，多余肢体，动漫，卡通，现代 3D，锐利数码线稿，镜头光晕，水粉厚涂，绢本设色

    reference_assets: []
    aspect_ratio: "9:16"
    applicable_content_types: [山水, 云雾, 水面, 花鸟, 空镜]
    source_files: [docs/VISUAL_STYLE.md]

    material:
      kind: raw_paper
      prompt: 生宣纸本，纸纹可见，墨迹在纤维上自然洇开
    line:
      style: freehand
      prompt: 笔触概括，虚实相生，局部边缘消失在留白中
    detail:
      level: moderate
      prompt: 允许局部虚化、概括与抽象；不追求所有物体边缘清晰

    motion:
      primary: [static, slow_lateral_track, ink_diffusion]
      local: [ink_diffusion, mist, water, birds, clouds]
      wan:
        allowed: true
        usage: limited
        note: 只在云雾、水面、飞鸟确实改善画面时使用；不用于主体位移或连续人物动作
      forbidden: [fast_pan, handheld_shake, subject_displacement]

      camera:
        default: slow_push_in
        allowed: [slow_push_in, slow_pull_out, slow_lateral_track, scroll_pan, push_in_with_pan, static]
        scroll_speed_px_s: 18
        slow_track_speed_factor: 0.6
        push_rate_per_s: 0.008
        push_pan_fraction: 0.02
        push_scale_min: 1.03
        push_scale_max: 1.06
        easing: ease_in_out
        focus: [0.5, 0.48]
      local_policy:
        water_ripple:
          enabled: true
          amplitude_px: 2.2
          period_s: 13.0
          opacity: 1.0
          feather_px: 55
          wavelength_px: 320
          vertical_ratio: 0.26
          perspective_far_scale: 0.12
        reflection_distortion:
          enabled: true
          amplitude_px: 1.2
          period_s: 13.0
          opacity: 1.0
          feather_px: 45
          wavelength_px: 320
          vertical_ratio: 0.26
          perspective_far_scale: 0.12
          reflection_ratio: 0.55
          reflection_lag_s: 0.2
          smear_px: 3.0
        cloud_drift:
          enabled: true
          amplitude_px: 14.0
          period_s: 24.0
          opacity: 1.0
          feather_px: 60
        leaf_sway:
          enabled: true
          amplitude_px: 1.1
          period_s: 7.5
          opacity: 1.0
          feather_px: 30
          sway_exponent: 1.5
          top_decay: 0.25
        reed_sway:
          enabled: true
          amplitude_px: 1.7
          period_s: 8.5
          opacity: 1.0
          feather_px: 35
          sway_exponent: 1.35
          top_decay: 0.2
        ink_diffusion:
          enabled: true
          amplitude_px: 0
          period_s: 12.0
          opacity: 0.42
          feather_px: 70
      transition:
        type: ink_dissolve
        duration_s: 1.2
        max_fraction: 0.35
        feather: 0.12
        direction: ltr
        seed: 13

    # 美学设计上游：共享六维数据结构，风格差异只来自这里的配置。
    # 由 drama_studio.aesthetics 消费；不是提示词模板目录。
    aesthetic_profile:
      composition:
        preferred_strategies: [rule_of_thirds, negative_space, vertical_depth, high_distance, level_distance, void_solid]
        default_subject_position: center
        whitespace_range: [0.25, 0.55]
        shot_sizes: [wide, extreme_wide, medium]
      lighting:
        preferred: [moon_diffuse, mist_scatter, soft_ambient, backlight]
        default_key: moon
        default_quality: soft
        default_direction: diffuse
        default_contrast: low
        rim_light: rare
      color:
        continuity_group: ink_wash
        dominant_keys: [生宣, 淡墨]
        secondary_keys: [中墨, 浓墨]
        accent_keys: [赭石, 淡花青]
        default_temperature: neutral
        saturation_range: [0.0, 0.18]
        value_range: full
      depth:
        default_layers: 3
        aerial_perspective: true
        sharpness_falloff: deep
      mise_en_scene:
        period: 中国古代
        architecture_positive: 传统木构、茅舍、石桥、渔舟，结构简练
        positive_constraints:
          - 建筑与器物均为古代形制
          - 水面为自然江河，岸边为土坡与杂木
      storytelling:
        default_rhythm: slow
        emotion_vocabulary: [静谧, 空灵, 苍茫, 悠远]

    compositing:
      primitives: [ink_matte, ink_diffusion, paper_texture, local_motion]
      texture:
        kind: raw_paper
        asset: null
        opacity: 0.14
        note: 纹理强度克制，不得影响墨色层次与主体可读性
      parallax:
        allowed: true
        requires: 需要独立前景资产或补底合格的背景板；补底只在"露出来也像画"时成立（M8 实测能量比 ≥0.5）
        camera_moves: [slow_push_in, slow_pull_out]
        max_plates: 3
        depth_alpha_min: 0.45
        depth_alpha_max: 0.85
        background_margin: 0.0
      note: 遮罩必须边缘柔化、渐进变化；禁止简单阈值造成硬边缘

# 2026-11-04 人工 A/B 选型基线。完整 prompt 与 sha256 来自 source_snapshot；
# 生成链路可按 style_id 读取 production_baselines，但不得按 style_id 写代码分支。
  shinkai_scenery:
    id: shinkai_scenery
    name: 新海诚式透明光影场景
    name_en: Luminous Anime Scenery
    description: 现代日本动画电影背景美术：高饱和夏日天空、体积积雨云、金时刻逆光与雨后高光倒影，主要用于纯场景短片。

# Local Drama Studio - Path Decoupling Configuration Example
# Copy this file to config/local-paths.yaml and configure for your local environment.

# Base output root for content production (outside git tracking, e.g. ./studio_data or /path/to/DramaStudio)
output_root: "./studio_data"

# Standard subdirectories inside output_root
subdirs:
  projects: "projects"   # Project scripts, scene breakdown and prompt files
  build: "build"         # Intermediate anchor keyframes, raw 480P videos, temp audio
  deliver: "deliver"     # Final 2K upscaled 32fps videos, SBS comparison boards, mixed master clips

# Model root directories (configure your local model repository)
models:
  diffusion_models: "models/diffusion_models"
  audio_models: "models/audio"
  lora_models: "models/loras"
  vae_models: "models/vae"
  text_encoders: "models/text_encoders"

# Service endpoints
endpoints:
  comfyui: "http://127.0.0.1:8188"

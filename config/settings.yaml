# Paths are resolved against the project root unless absolute.
paths:
  models_root: "${DRAMA_MODELS_ROOT}"
  runtime_root: "runtime"
  projects_root: "projects"
  logs_root: "logs"
  workflows_root: "workflows"

comfyui:
  host: "127.0.0.1"
  port: 8188
  startup_timeout_seconds: 180
  request_timeout_seconds: 600
  workflow_timeout_seconds: 1800
  poll_interval_seconds: 2

# Single local LLM port: 8080. The project owns it while its llama-server is
# running; the daily OpportunityRadar task must detect this and defer until the
# port is free (decision 2026-11-03). Do not introduce a second LLM port.
# Verified 2026-11-03: serves Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
# CPU-only (-ngl 0) with a 65536-token context (--fa on); use the served alias.
llm:
  base_url: "http://127.0.0.1:8080/v1"
  api_key: "sk-local"
  model: "Qwen3-30B-A3B-Instruct-2507"
  model_path: "${DRAMA_MODELS_ROOT}/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
  context_size: 65536
  temperature: 0.2
  max_repair_attempts: 2

# Local TTS service on 50000. Target backend: VoxCPM2 (VoxCPM-Runtime, 48 kHz).
tts:
  base_url: "http://127.0.0.1:50000"
  sample_rate: 48000   # final mix sample rate; VoxCPM2 already outputs 48 kHz
  # Default TTS mode/voice live in config/audio.yaml (single source).

ffmpeg:
  binary: "ffmpeg"
  ffprobe: "ffprobe"
  threads: 8

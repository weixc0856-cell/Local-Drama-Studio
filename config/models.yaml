# Canonical model store lives outside the repo
#
# IMPORTANT: the local LLM launcher scans only the TOP LEVEL of the model store
# for *.gguf. Diffusion GGUFs used by ComfyUI live under diffusion_models/ and
# are exposed through runtime/ComfyUI/extra_model_paths.yaml.
# New companion files go into text_encoders/ and vae/ subfolders, and ComfyUI
# sees both layouts through runtime/ComfyUI/extra_model_paths.yaml.
models:
  flux_3_klein:
    role: image
    family: flux3-klein
    loader_node: UnetLoaderGGUF
    files:
      unet_gguf: "diffusion_models/flux3/flux-3-image-klein-Q4_K_M.gguf"
      text_encoder: "text_encoders/qwen3vl_4b_int8_convrot.safetensors"
      vae: "vae/flux2-vae.safetensors"
    sizes:
      unet_gguf: 3666908064
      text_encoder: 4858559240
      vae: 336211292
    notes: "FLUX.3 Klein distilled: 16 steps, CFG 1.0, er_sde/simple. Qwen3-VL-4B encoder runs on CPU. The official 9B prompt upsampler is unusable on this machine; production uses the local Qwen caption stage (docs/DECISIONS.md (ADR-016))."

  wan_2_2_ti2v_5b:
    role: video
    family: wan2.2-ti2v-5b
    loader_node: UnetLoaderGGUF
    files:
      unet_gguf: "Wan2.2-TI2V-5B-Q4_K_M.gguf"
      text_encoder: "text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
      vae: "vae/wan2.2_vae.safetensors"
    sizes:
      unet_gguf: 3433116000
      text_encoder: 6735906897
      vae: 1409400960
    notes: "TI2V-5B is not a scaled-down 14B. Use its own VAE and latent workflow; no CLIP vision required."

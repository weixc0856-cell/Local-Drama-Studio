# Canonical model store lives outside the repo: D:\AI\models
#
# IMPORTANT: D:\AI\start_server.bat scans only the TOP LEVEL of D:\AI\models
# for *.gguf. Do not move the two existing diffusion GGUFs into subfolders.
# New companion files go into text_encoders/ and vae/ subfolders, and ComfyUI
# sees both layouts through runtime/ComfyUI/extra_model_paths.yaml.
models:
  flux_2_klein_4b:
    role: image
    family: flux2-klein
    loader_node: UnetLoaderGGUF
    files:
      unet_gguf: "D:/AI/models/flux-2-klein-4b-Q4_K_M.gguf"
      text_encoder: "D:/AI/models/text_encoders/qwen_3_4b.safetensors"
      vae: "D:/AI/models/vae/flux2-vae.safetensors"
    sizes:
      unet_gguf: 2604311104
      text_encoder: 8044982048
      vae: 336211292
    notes: "Qwen3-4B encoder only; the 8B encoder is not a valid substitute. Use the FLUX.2 VAE, not FLUX.1."

  wan_2_2_ti2v_5b:
    role: video
    family: wan2.2-ti2v-5b
    loader_node: UnetLoaderGGUF
    files:
      unet_gguf: "D:/AI/models/Wan2.2-TI2V-5B-Q4_K_M.gguf"
      text_encoder: "D:/AI/models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
      vae: "D:/AI/models/vae/wan2.2_vae.safetensors"
    sizes:
      unet_gguf: 3433116000
      text_encoder: 6735906897
      vae: 1409400960
    notes: "TI2V-5B is not a scaled-down 14B. Use its own VAE and latent workflow; no CLIP vision required."

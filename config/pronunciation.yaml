# 古诗词普通话读音与声学替换词典（词组级，最长匹配，不做单字全局替换）。
#
# 四层文本严格分离：
#   source_text   原始文本（多为繁体）
#   display_text  字幕，永不改写
#   tts_text      送入引擎前的简体文本
#   acoustic_text tts_text 经过 tts_alias 同音替换后的实际发声文本
#
# tts_alias 只改变 acoustic_text；display_text / source_text 必须逐字不变。
# 只有经过音频验证的 G2P 缺陷才配置 tts_alias。未配置别名的词条继续保留
# 预期读音与命中记录，用于 ASR/人工复核，不做替换。
# 所有新映射的 status 初始为 candidate；只有音频测试通过且人工复核 APPROVED
# 才能改为 verified（schema 会拒绝无证据的 verified）。
schema_version: "2.0"

capabilities:
  api_phoneme_control: false
  api_pinyin_control: false
  pitch_control: false
  duration_control: false
  acoustic_substitution: true
  display_text_protected: true
  substitution_method: "curated homophone alias, acoustic layer only"
  note: CosyVoice-300M-SFT /tts 只接收 text / speaker / speed / text_frontend；谐音替换在调用前完成


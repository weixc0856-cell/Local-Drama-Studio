# Copied to runtime/ComfyUI/extra_model_paths.yaml by scripts/setup.ps1.
#
# The diffusion GGUFs stay at the TOP LEVEL of the external model store because
# the local LLM launcher scans only that level. Companion files live in
# text_encoders/ and vae/ subfolders. Both layouts are exposed here without
# moving or duplicating several GB of weights.
ai_shared:
  base_path: ${DRAMA_MODELS_ROOT}
  diffusion_models: |
    .
    diffusion_models
  text_encoders: text_encoders
  vae: vae

# config/z_image_styles.yaml
# Z-Image Turbo 官方视觉风格图谱与 7 维度 Prompt 实验库 (Visual Style Atlas)
#
# 设计原则：
# 1. 采用完整自然语言长描述，拒绝无意义的标签堆砌（如 8k, masterpiece, best quality）。
# 2. Z-Image Turbo 采用 8 步 DiT 前向推理，零 CFG/少步蒸馏，严禁依赖独立 Negative Prompt，
#    负向约束一律通过自然语言（例如 a clean empty background without graphic overlays）融入正向提示词。
# 3. 画面若包含指定文字，必须使用英文双引号标记（例如 "STATION"）。
# 4. 严格按照 7 维度视觉结构建模：
#    (1) Subject (2) Scene (3) Composition (4) Lighting (5) Medium & Style (6) Color & Texture (7) Constraints
#
schema_version: "2.0"
model_target: "z_image_turbo"

categories:
  A:
    name: 写实摄影与人物肖像
    name_en: Portrait & Photography
    priority: HIGHEST
  B:
    name: 影视与电影概念艺术
    name_en: Cinematic & Film Aesthetics
    priority: HIGHEST
  C:
    name: 中国传统美学与国风
    name_en: Traditional Chinese & Oriental Aesthetics
    priority: HIGHEST
  D:
    name: 动漫与动画电影
    name_en: Anime & Animation Art
    priority: HIGHEST
  E:
    name: 商业广告与产品摄影
    name_en: Commercial Advertising & Product Photography
    priority: HIGH
  F:
    name: 平面设计与编辑插画
    name_en: Graphic Design & Editorial Illustration
    priority: HIGH
  G:
    name: 奇幻、超现实与实验艺术
    name_en: Fantasy, Surreal & Experimental Art
    priority: MEDIUM_HIGH
  H:
    name: 手工媒介与复古风格
    name_en: Traditional Mediums & Vintage Art
    priority: MEDIUM_HIGH
  T:
    name: 2026 前瞻视觉趋势
    name_en: 2026 Visual Design Trends
    priority: HIGH

styles:
  # ============================================================================
  # A. 写实摄影与人物肖像
  # ============================================================================
  editorial_fashion:
    id: editorial_fashion
    code: "01"
    category: A
    name: 高级时尚人像
    name_en: Editorial Fashion
    application: 社交媒体、人物封面、高端时尚广告、品牌写真
    dimensions:
      subject: a young East Asian woman with natural facial features and relaxed confident expression, wearing a minimalist black tailored outfit
      scene: beside a large floor-to-ceiling window in a contemporary minimalist architectural interior
      composition: medium close-up composition, elegant spatial balance
      lighting: soft directional daylight illuminating the face, creating gentle natural shadows
      medium_style: medium-format fashion photography, refined magazine editorial aesthetic
      color_texture: elegant neutral color palette, realistic skin texture, subtle makeup
      constraints: authentic unretouched skin pores, no oversaturation, clean uncluttered frame
    positive_prompt: >-
      A sophisticated editorial fashion portrait of a young East Asian woman with natural facial features,
      wearing a minimalist black tailored outfit. She stands beside a large window in a contemporary
      architectural interior. Soft directional daylight illuminates her face, creating gentle shadows.
      Medium close-up composition, relaxed confident expression, subtle makeup, realistic skin texture,
      elegant neutral color palette, medium-format fashion photography, refined magazine editorial aesthetic.

  street_documentary:
    id: street_documentary
    code: "02"
    category: A
    name: 街头纪实摄影
    name_en: Street Documentary
    application: 纪实短片、人文摄影、真实生活感视觉素材
    dimensions:
      subject: a young Asian woman in everyday casual clothes carrying a canvas bag, candid unposed expression

      color_texture: subtle 35mm film grain, authentic street color rendition, realistic wet pavement texture
      constraints: authentic motion blur in background pedestrians, unposed natural posture, no synthetic plastic look
    positive_prompt: >-
      A candid documentary photograph of a young Asian woman walking through a crowded urban street after rainfall.
      She wears ordinary everyday clothes and carries a canvas bag. Reflections of shop lights appear on the wet
      pavement, pedestrians move naturally in the background. Slightly imperfect framing, direct available light,
      authentic facial expressions, subtle 35mm film grain, natural colors, unposed street photography.


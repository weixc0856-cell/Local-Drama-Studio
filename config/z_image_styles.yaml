  chinese_ink_wash:
    id: chinese_ink_wash
    code: "09"
    category: C
    name: 水墨山水
    name_en: Ink Wash Painting
    # 实测：山水主体会触发青绿设色先验，加强正向排他措辞仍无法压制（已验证）。
    # 色偏只在色度上（平均饱和度 18.9/255），转灰度即可还原纯水墨，故交付时自动附纯墨版。
    postprocess: grayscale
    application: 国风纪录片、文化典籍分镜、高雅艺术视觉
    dimensions:
      subject: towering craggy mountains emerging through layers of swirling mist, a tiny wooden fishing boat on calm waters
      scene: vast river canyon surrounded by precipitous peaks and distant pines
      composition: classical Chinese landscape composition, dramatic balance of dense brushwork and expansive negative space
      lighting: diffused ethereal light natural to traditional ink wash art
      medium_style: traditional Chinese ink wash painting, expressive sumi-e brushwork, wet ink diffusion and dry brush dry-rub texture
      color_texture: monochromatic black and charcoal tones, handmade raw xuan paper texture with organic fiber flecks
      constraints: strict traditional brush aesthetics, authentic ink bleed, no synthetic Western shading, no modern photographic elements
    positive_prompt: >-
      A traditional Chinese ink wash landscape painting of towering mountains emerging through layers of mist.
      A small wooden boat travels along a quiet river, with a tiny fisherman beneath distant cliffs. Expressive
      brushwork, varying ink density, wet ink diffusion, dry brush textures, delicate mountain contours,
      extensive negative space, handmade xuan paper texture, monochromatic black and gray palette.


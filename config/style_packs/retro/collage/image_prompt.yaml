schema_version: '1.0'
identity: layered vintage paper collage
medium: cut paper, torn edges, halftone photo fragments, screen-print ink
materials:
- paper fibre
- torn edges
- halftone print
- aged photograph
composition:
- asymmetric layered composition with overlapping fragments
- deliberate empty paper gaps
- a single layout with clear paper layers
- one large focal fragment with smaller supporting scraps
- photographed objects are flattened into print with scratches, creases and halftone
  dots
- flat scan-like view with small local shadows
- clean full-bleed edges with no frame
prompt_order:
- subject
- medium
- composition
- lighting
- material
- camera
positive_anchors:
- every element reads as a cut paper piece
- torn fibrous edges and visible print grain
- scraps overlap with small cast shadows between layers
- limited ink palette of cream, black, vermilion, cobalt and olive
- deliberate bare paper gaps
- objects carry scratches, creases or halftone so they belong to the paper
- no digital glow and no smooth gradients

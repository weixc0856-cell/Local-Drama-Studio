schema_version: '1.0'
motion_vocabulary:
- grid advancing
- neon pulse
- light band sweep
secondary_limit: 2
preserve:
- neon glow
- chrome reflection
- grid perspective
avoid:
- readable text or signage
- photoreal daylight
- pastel palette
- cluttered composition
- western city
- 3d game render
- soft focus
- sunset in every image
- centered symmetric composition in every image
- diptych
- split screen
- two panels
- stacked frames

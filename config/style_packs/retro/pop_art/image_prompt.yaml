schema_version: '1.0'
identity: pop art screen print, comic panel energy
medium: halftone dots, bold black contours, flat ink colour
materials:
- newsprint
- halftone screen
- flat ink
composition:
- one product-scale subject filling the frame
- repeated motif grid or a hard panel divide
- flat graphic background
- one consistent halftone dot scale across the image
- slight off-registration between colour blocks and black keyline
- a small starburst or blank label band, no readable letters
- clean full-bleed edges with no frame
prompt_order:
- subject
- medium
- composition
- lighting
- material
- camera
positive_anchors:
- thick even black contour lines
- flat unmodulated colour blocks
- visible halftone dot pattern
- primary red, yellow and blue palette
- no gradients and no soft shadows
- one halftone dot scale and a slight colour misregistration
- a starburst or blank label shape without readable letters
- no text and no speech bubble

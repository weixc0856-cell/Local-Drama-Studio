schema_version: '1.0'
motion_vocabulary:
- cloud drift
- light shimmer
- rain streak
- wind in grass
secondary_limit: 2
preserve:
- luminous sky
- detailed clouds
- reflected light
- clean linework
avoid:
- flat cel shading
- chibi characters
- readable text or signage
- neon cyberpunk
- photoreal skin
- 3d render
- dull grey sky
- western city
- hdr clipping
- character close-up
- broken wires
- knotted cables
- repeated centered cumulus tower
- multi-panel image
- contact sheet
- grid of images
- split image
- diptych
- triptych
- multiple frames
- collage

schema_version: '1.0'
identity: contemporary impasto oil painting, sculpted paint surface
medium: thick oil paint applied with a palette knife, canvas weave, raised ridges
materials:
- oil paint
- canvas
- palette knife
- linseed sheen
composition:
- one strong subject filling the frame
- large colour blocks built from knife planes
- curved sweeping knife strokes follow the form of round objects
- thin paint and exposed canvas in shadows and distance, thick impasto only in lights
  and foreground
- shallow space with a clear light direction
- clean full-bleed edges with no frame
prompt_order:
- subject
- medium
- composition
- lighting
- material
- camera
positive_anchors:
- thick raised paint with visible ridges and knife marks
- palette knife planes cutting colour into solid blocks
- canvas weave showing through thin passages
- raking light and deep shadow across the paint relief
- limited five-colour palette held consistently
- curved knife strokes wrap around round forms instead of square patches
- thick lights against thin darks and exposed canvas
- no smooth blending and no airbrush finish

schema_version: '1.0'
identity: veristic surrealism, meticulous realism depicting impossible scenes
medium: smooth classical oil painting with photographic finish, dream logic
materials:
- smooth oil paint
- sand
- stone
- still water
- cloud
composition:
- a plain landscape or room with exactly one impossible event
- the event uses one device only, named by the subject
- everything else stays ordinary, calm and empty
- subject placed off-center with long arcades and extreme perspective
- shadows stretch farther than the light allows
- meticulous detail presented calmly, never dramatic
- clean full-bleed edges with no border
prompt_order:
- subject
- medium
- composition
- lighting
- material
- camera
positive_anchors:
- meticulous realistic detail in an impossible scene
- only one impossible element; the rest of the image stays ordinary
- 'material realism preserved: metal stays metal and wood stays wood'
- off-center placement, long arcades and shadows that stretch too far
- 'material inversion: stone, cloud, glass or wax behaving unlike itself'
- smooth classical brushwork with no visible gesture
- deep empty horizon and long cast shadows
- no characters, no creatures and no ornament

schema_version: '1.0'
identity: raw documentary photography, decisive moment
medium: 35mm film photograph, natural ambient light, fine grain, unedited
materials:
- 35mm film
- weathered surfaces
- dust and mist
- worn cloth
composition:
- one decisive moment with a clear subject
- natural framing with slight imperfection, no staged symmetry
- one natural light condition across the frame
- 'authentic imperfections: dust, scratches, vignetting, slight lens distortion'
- clean full-bleed edges with no frame
prompt_order:
- subject
- medium
- composition
- lighting
- material
- camera
positive_anchors:
- raw documentary photograph with natural ambient light
- 'authentic weathered surfaces: rust, cracked paint, mud and worn stone'
- fine 35mm grain, slight vignetting and honest color
- one decisive moment, not a staged composition
- real depth of field and natural lens falloff
- no retouching, no illustration and no 3d render

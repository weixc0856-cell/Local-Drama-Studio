schema_version: '1.0'
motion_vocabulary:
- ink diffusion
- mist drifting through ruins
- embers and ash floating
- dark robe hem swaying
secondary_limit: 2
preserve:
- stylized 3D animation forms
- dark brown and charcoal palette
- ruined stone and thatch detail
- ink-wash atmosphere and film grain
avoid:
- photoreal
- live-action
- realistic skin pores
- glossy plastic skin
- idol face
- bright pastel
- saturated neon
- clean anime
- western cartoon
- readable text
- watermark

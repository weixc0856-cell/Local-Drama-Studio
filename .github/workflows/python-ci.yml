name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        env:
          DRAMA_MODELS_ROOT: ${{ github.workspace }}/runtime/models
          DRAMA_AI_HOME: ${{ github.workspace }}/runtime
        run: python -m pytest -q
